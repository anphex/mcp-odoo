# Rate-Limit-Zone fuer die MCP-Download-Route.
#
# Gehoert in den http-Block, also nach /etc/nginx/conf.d/ (Dateiname mit
# fuehrender 00_ wie 00_nesa_rate_limits.conf, damit sie vor den vHosts
# geladen wird). Ohne diese Datei schlaegt jedes Location-Snippet fehl, das
# `zone=nesa_mcp_download` referenziert.
#
# 30 Anfragen/Minute je IP reichen fuer echte Downloads deutlich aus; die
# Route ist oeffentlich erreichbar und jede Anfrage kostet eine DB-Suche.
limit_req_zone $binary_remote_addr zone=nesa_mcp_download:1m rate=30r/m;
