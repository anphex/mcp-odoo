# MCP-Download-Route auf PORT 80, PRODUCTION (odoo.nesa.de).
#
# In den server-Block von odoo_http_nesa-main.conf includen, VOR der
# allgemeinen "location /"-Regel.
#
# Warum ueberhaupt noetig: Der Token IST die Autorisierung und steht im Pfad.
# Ohne diese Location faengt "location /" die Anfrage ab und schreibt den
# vollstaendigen Pfad — also den gueltigen Token — in access.log, bevor sie
# auf HTTPS umgeleitet wird. Ein Log-Leser koennte den Link waehrend seiner
# Laufzeit einloesen. Umgeleitet wird weiterhin, nur eben ohne Logzeile.
location ^~ /nesa/mcp/download/ {
    access_log off;
    return 301 https://$host$request_uri;
}

# ACHTUNG VHOST (Domain-Flip): Fuer nesa.de/www.nesa.de auf Port 80 gilt
# stattdessen mcp-token-routes-nesade-redirect.conf — dort wird auf
# https://nesa.de umgeleitet, nicht auf $host.
