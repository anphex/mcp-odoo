# MCP-Upload-Route auf PORT 80, PRODUCTION (odoo.nesa.de).
#
# In den server-Block von odoo_http_nesa-main.conf includen, VOR der
# allgemeinen "location /"-Regel.
#
# Warum noetig: Der Token IST die Autorisierung und steht im Pfad. Ohne diese
# Location faengt "location /" die Anfrage ab und schreibt den vollstaendigen
# Pfad — also einen gueltigen Upload-Link — in access.log, bevor sie auf HTTPS
# umgeleitet wird. Umgeleitet wird weiterhin, nur eben ohne Logzeile.
location ^~ /nesa/mcp/upload/ {
    access_log off;
    return 301 https://$host$request_uri;
}
