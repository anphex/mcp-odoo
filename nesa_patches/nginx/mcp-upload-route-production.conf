# MCP-Upload-Route, PRODUCTION (odoo.nesa.de -> 127.0.0.1:3012).
#
# In den server-Block von odoo_https_nesa-main.conf includen, VOR
# der allgemeinen "location /"-Regel. Voraussetzung: die Zone aus
# 00_nesa_mcp_upload_zone.conf ist geladen.
#
# ACHTUNG VHOST (Domain-Flip): Auf PRODUCTION steht `web.base.url` auf
# https://nesa.de. Jeder gepraegte Link zeigt damit auf nesa.de, nicht auf
# odoo.nesa.de. Dieses Snippet gehoert deshalb ZUERST in den Vhost mit
# `server_name nesa.de` (odoo_https_nesa_de.conf) — sonst faengt dort
# `location /` die Anfrage und schreibt den Token ins access.log. Der
# odoo.nesa.de-Alias-Vhost bekommt es zusaetzlich, weil Alt-Links und interne
# Aufrufe weiter dorthin zeigen koennen. Umleitende Vhosts (www.nesa.de,
# Port 80) brauchen stattdessen mcp-token-routes-nesade-redirect.conf.
# Verifiziert am 2026-08-29: ohne diesen Include stand ein gueltiger Token
# im Klartext in /var/log/nginx/access.log.
#
# Gleicher Grund wie bei der Download-Route: der Token IST die Autorisierung
# und steht im Pfad. Ohne `access_log off` stuende ein gueltiger Upload-Link in
# jeder Access-Log-Zeile — und ein Upload-Link ist ein Schreibrecht auf Zeit.
# Odoo-seitig ist er zusaetzlich genau einmal einloesbar.
#
# ROLLOUT-REIHENFOLGE (HART): dieses Snippet muss AKTIV sein, bevor der
# Controller im Odoo-Modul erreichbar wird. Andersherum schreibt der
# allgemeine "location /"-Block jeden Upload-Link ins Access-Log.
location ^~ /nesa/mcp/upload/ {
    access_log off;
    # `access_log off` allein reicht nicht: `limit_req` protokolliert jeden
    # abgewiesenen Request samt URI — also samt Token — im Error-Log, und der
    # laeuft global auf `notice` (Review-MAJOR 2026-08-29).
    error_log /dev/null crit;
    limit_req zone=nesa_mcp_upload burst=5 nodelay;
    limit_req_status 429;
    limit_conn nesa_mcp_upload_conn 2;
    limit_conn_status 429;

    # Harte Groessengrenze schon vor Odoo; der Server-Block laesst sonst
    # unbegrenzte Bodies zu. Odoo setzt dieselbe Grenze noch einmal selbst.
    client_max_body_size 40m;
    # Ein Tropf-Upload soll nginx binden, nicht den Odoo-Worker.
    client_body_timeout 60s;
    # Request-Buffering bleibt AN: nginx nimmt den Koerper vollstaendig
    # entgegen, bevor Odoo ueberhaupt einen Worker dafuer belegt.

    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    proxy_pass http://127.0.0.1:3012;
}
