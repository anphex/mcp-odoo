# Token-Routen auf den Umleitungs-Vhosts von PRODUCTION (www.nesa.de und
# Port 80 fuer nesa.de/www.nesa.de).
#
# Warum es diese Datei gibt: Seit dem Domain-Flip ist `web.base.url` auf
# PRODUCTION `https://nesa.de`. Jeder von Odoo gepraegte Download- oder
# Upload-Link zeigt also auf nesa.de — NICHT auf odoo.nesa.de. Ein Vhost, der
# solche Anfragen nur umleitet, schreibt den vollstaendigen Pfad und damit den
# Token vorher ins access.log. Der Token IST die Autorisierung; eine Logzeile
# ist ein verwendbares Secret.
#
# Diese Datei gehoert in JEDEN Vhost, der Anfragen fuer nesa.de/www.nesa.de nur
# weiterleitet. Der Vhost, der die Anfragen wirklich bedient (server_name
# nesa.de, Port 443), braucht stattdessen die echten Routen-Snippets
# nesa-mcp-download-production.conf und nesa-mcp-upload-production.conf.
location ^~ /nesa/mcp/download/ {
    access_log off;
    error_log /dev/null crit;
    return 301 https://nesa.de$request_uri;
}

location ^~ /nesa/mcp/upload/ {
    access_log off;
    error_log /dev/null crit;
    return 301 https://nesa.de$request_uri;
}
