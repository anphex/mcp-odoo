# Negative MCP and OAuth routing shared by the public NESA MCP vhosts.
#
# Exact HTTPS capability locations are declared separately and keep precedence
# over the /mcp/ prefix below. HTTP vhosts intentionally have no capability
# locations, so tokens are never reflected into an HTTPS redirect.

location = /mcp {
    auth_basic off;
    satisfy all;
    allow all;
    access_log off;
    log_not_found off;
    error_log /dev/null crit;
    return 404;
}

location ^~ /mcp/ {
    auth_basic off;
    satisfy all;
    allow all;
    access_log off;
    log_not_found off;
    error_log /dev/null crit;
    return 404;
}

# MCP authorization is optional. NESA deliberately does not expose OAuth for
# these capability-authenticated endpoints, so client discovery must get an
# unambiguous negative response without authentication challenges or redirects.
location ~* ^/(?:\.well-known/(?:oauth-protected-resource|oauth-authorization-server|openid-configuration|jwks\.json)(?:/.*)?|(?:[^/]+/)+\.well-known/openid-configuration(?:/.*)?|oauth2?(?:/.*)?|authorize(?:/.*)?|token(?:/.*)?|register(?:/.*)?|revoke(?:/.*)?|introspect(?:/.*)?|device_authorization(?:/.*)?)$ {
    auth_basic off;
    satisfy all;
    allow all;
    access_log off;
    log_not_found off;
    error_log /dev/null crit;
    return 404;
}
