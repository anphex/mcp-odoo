# MCP-Download-Route, PRODUCTION (odoo.nesa.de -> 127.0.0.1:3012).
#
# In den server-Block von odoo_https_nesa-main.conf includen, VOR
# der allgemeinen "location /"-Regel. Voraussetzung: die Zone aus
# 00_nesa_mcp_download_zone.conf ist geladen.
#
# ACHTUNG VHOST (Domain-Flip): Auf PRODUCTION steht `web.base.url` auf
# https://nesa.de. Jeder gepraegte Link zeigt damit auf nesa.de, nicht auf
# odoo.nesa.de. Dieses Snippet gehoert deshalb ZUERST in den Vhost mit
# `server_name nesa.de` (odoo_https_nesa_de.conf) — sonst faengt dort
# `location /` die Anfrage und schreibt den Token ins access.log. Der
# odoo.nesa.de-Alias-Vhost bekommt es zusaetzlich, weil Alt-Links und interne
# Aufrufe weiter dorthin zeigen koennen. Umleitende Vhosts (www.nesa.de,
# Port 80) brauchen stattdessen mcp-token-routes-nesade-redirect.conf.
# Verifiziert am 2026-08-29: ohne diesen Include stand ein gueltiger Token
# im Klartext in /var/log/nginx/access.log.
#
# Warum ueberhaupt eine eigene Location: Der Token IST die Autorisierung und
# steht im Pfad — anders laesst sich ein klickbarer Link nicht bauen. Ohne
# `access_log off` landet er in jeder Access-Log-Zeile und ist waehrend seiner
# Laufzeit fuer jeden Log-Leser verwendbar. Odoo-seitig ist ein Link deshalb
# zusaetzlich standardmaessig nur einmal abrufbar.
location ^~ /nesa/mcp/download/ {
    access_log off;
    limit_req zone=nesa_mcp_download burst=10 nodelay;
    limit_req_status 429;

    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    proxy_pass http://127.0.0.1:3012;
}
