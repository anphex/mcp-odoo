# MCP-Upload-Route auf PORT 80, STAGING (staging-odoo.nesa.de).
#
# In den server-Block von odoo_http_staging-odoo_nesa_de.conf includen, VOR
# der allgemeinen "location /"-Regel.
#
# Gleicher Grund wie bei der Download-Route: ohne diese Location schreibt
# "location /" den gueltigen Token in access.log, bevor auf HTTPS umgeleitet
# wird. Die Staging-Zugangssperre gilt hier unveraendert weiter.
#
# Hochgeladen wird ohnehin nur ueber HTTPS: die ausgegebene URL kommt aus
# `web.base.url`, und ein `curl -T` folgt einem 301 nicht.
location ^~ /nesa/mcp/upload/ {
    access_log off;
    include snippets/staging_lock.conf;
    return 301 https://$host$request_uri;
}
