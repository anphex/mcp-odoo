# Download-Route der MCP-Bridge (nesa_mcp_bridge, /nesa/mcp/download/<token>).
#
# Zweck: Der Token IST die Autorisierung und steht im Pfad — ein klickbarer
# Link laesst sich nicht anders bauen. Damit landet er ohne diese Datei in
# "$request" jeder Access-Log-Zeile und ist waehrend seiner Laufzeit fuer
# jeden Log-Leser verwendbar (Review-MAJOR 2026-08-22).
#
# Gegenmassnahmen hier:
#   * access_log off  — der Pfad wird gar nicht erst protokolliert.
#   * eigene Rate-Limit-Zone — eine zufaellige Anfrage kostet sonst eine
#     DB-Suche plus Log-Zeilen; die Route ist oeffentlich erreichbar.
#
# Ergaenzend Odoo-seitig: Links sind standardmaessig einmal abrufbar, die TTL
# ist kurz, und die Antwort traegt Cache-Control: no-store und
# Referrer-Policy: no-referrer.
#
# Einbindung: in den Server-Block des Odoo-vHosts includen, VOR der
# allgemeinen "location /"-Regel. Die Zone gehoert in den http-Block
# (siehe 00_nesa_rate_limits.conf):
#
#   limit_req_zone $binary_remote_addr zone=nesa_mcp_download:1m rate=30r/m;

location ^~ /nesa/mcp/download/ {
    access_log off;
    limit_req zone=nesa_mcp_download burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://odoo;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
