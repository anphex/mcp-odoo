# Rate-Limit-Zone fuer die MCP-Upload-Route.
#
# Gehoert in den http-Block, also nach /etc/nginx/conf.d/ (Dateiname mit
# fuehrender 00_ wie 00_nesa_mcp_download_zone.conf, damit sie vor den vHosts
# geladen wird). Ohne diese Datei schlaegt jedes Location-Snippet fehl, das
# `zone=nesa_mcp_upload` referenziert.
#
# Eigene Zone statt Mitbenutzung der Download-Zone: ein Schwall Downloads soll
# einen laufenden Upload nicht ausbremsen und umgekehrt. 20 Anfragen/Minute je
# IP reichen deutlich — jeder Upload-Token ist einmalig, mehr als ein PUT pro
# Link gibt es per Konstruktion nicht.
limit_req_zone $binary_remote_addr zone=nesa_mcp_upload:1m rate=20r/m;
